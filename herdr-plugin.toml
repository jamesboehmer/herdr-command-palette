id = "jamesboehmer.command-palette"
name = "Command Palette (fzf)"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Every herdr action in one palette — all of herdr's built-in core API actions (split a pane, new tab, switch workspace, git worktrees, agents, server config…) and every action exposed by every installed plugin, in a single fuzzy-searchable fzf popup: pick one and it runs. Built-ins go straight to the socket API via the herdr CLI, prompting for a name or offering a second picker where one is needed; plugin actions are dispatched with `herdr plugin action invoke`. The picker runs in an overlay pane so fzf gets a real TTY; the origin pane, tab, workspace and cwd are forwarded so both kinds of action resolve the place you opened the palette from."
platforms = ["linux", "macos"]

# The user-facing entry point. Herdr qualifies it globally as
# `jamesboehmer.command-palette.open`. Like every action, its command is run by
# the herdr server WITHOUT a TTY, so it cannot run fzf itself — instead it opens
# the `palette` overlay pane (below), which is where the interactive picker lives.
# cwd defaults to the plugin root for actions, so the relative `open.sh` resolves.
[[actions]]
id = "open"
title = "Command palette (herdr built-ins + all plugin actions)"
contexts = ["workspace"]
command = ["bash", "open.sh"]

# The interactive popup. `overlay` placement = a temporary zoomed overlay over the
# active pane, which is exactly the "command palette" feel we want. This pane DOES
# get a TTY, so fzf works. The command is invoked with an absolute path via
# $HERDR_PLUGIN_ROOT because open.sh opens this pane with `--cwd <origin repo>`,
# which would otherwise break resolution of a relative script path.
[[panes]]
id = "palette"
title = "Command palette"
placement = "overlay"
command = ["bash", "-c", "exec \"$HERDR_PLUGIN_ROOT/palette.sh\""]

# NOTE: herdr 0.7 does NOT bind keys declared in a plugin manifest. Bind a key in
# your ~/.config/herdr/config.toml instead, then `herdr server reload-config`:
#
#   [[keys.command]]
#   key = "prefix+p"
#   type = "plugin_action"
#   command = "jamesboehmer.command-palette.open"
#   description = "Command palette"
